schema: spec-driven

context: |
  The `openspec/specs/` corpus is a two-level tree:
  `specs/{domain}/{capability}/spec.md`. The domains are `document`, `codec`,
  `color`, `compositing`, `imaging`, `tools`, `ui`, `interop`,
  `verification`, and `meta` (repository and development-process contracts);
  every capability belongs to exactly one domain. A
  capability's id is its directory path relative to `specs/`, for example
  `compositing/layer-compositing`. Changes stay flat under
  `openspec/changes/<name>/`, but each capability delta mirrors the main
  spec's path.

rules:
  proposal:
    - "File each new or modified capability under an existing domain: `specs/{domain}/{capability}/spec.md`."
    - "Use the capability's path relative to `specs/` as its id, for example `compositing/layer-compositing`."
    - "Do not introduce a new domain or a deeper path without a layout change."
  specs:
    - "Write each capability delta at the mirrored path `changes/<name>/specs/{domain}/{capability}/spec.md`."
    - "Keep the delta path identical to the main spec path it targets."
  tasks:
    - "Pair tasks.md with a test-plan.md in the change folder: one table row per spec scenario (its [tag], or its title when untagged) whose last column, Coverage, names the automated tests (`tst_<suite>::<case>` or `<crate>::<fn>`) or reads `manual: <reason>`."
    - "Add a task to write each automated test the plan names that does not exist yet."
  tasks:
    - "End tasks.md with a 'Test plan' section: one row per scenario tag ([lcs_...]) mapping it to the test that covers it, or 'manual: <reason>'."
    - "Include a task to write each missing automated test before the implementation tasks are checked off."
