ci_build = true

[[check]]
id = "clippy"
scope = "build"
cost = "expensive"
phase = "sequential"
command = '''
clippy_errors=$(cargo clippy --workspace --all-targets -- -D warnings 2>&1 | grep -cE '^error' || true)
echo "clippy_errors=$clippy_errors"
[ "$clippy_errors" -eq 0 ] || { echo "clippy: FAILED"; exit 1; }
'''
local_fast = true
local_full = true
ci_guards = false
ci_build = true

