[workspace]
resolver = "2"
members = [
    "crates/pictura-core",
    "crates/pictura-codec",
    "crates/pictura-color",
    "crates/pictura-adjust",
    "crates/pictura-filters",
    "crates/pictura-ops",
    "crates/pictura-paint",
    "crates/pictura-select",
    "crates/pictura-render",
    "crates/pictura-testkit",
    "crates/pictura-script",
    "crates/pictura-mcp",
    "crates/pictura-app",
]

[workspace.package]
version = "0.3.0" # x-release-please-version
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.98"

[workspace.dependencies]
thiserror = "2"

# Pixel-heavy correctness/oracle tests run far faster compiled than interpreted,
# but compiling all 123 dependencies at opt-level 2 is not worth it: the
# workspace crates keep the optimisation, dependencies do not.
[profile.test]
opt-level = 0
debug = "line-tables-only"

[profile.test.package."*"]
opt-level = 0
debug = false

[profile.test.package.pictura-core]
opt-level = 2

[profile.test.package.pictura-codec]
opt-level = 2

[profile.test.package.pictura-color]
opt-level = 2

[profile.test.package.pictura-adjust]
opt-level = 2

[profile.test.package.pictura-filters]
opt-level = 2

[profile.test.package.pictura-ops]
opt-level = 2

[profile.test.package.pictura-paint]
opt-level = 2

[profile.test.package.pictura-select]
opt-level = 2

[profile.test.package.pictura-render]
opt-level = 2

[profile.test.package.pictura-testkit]
opt-level = 2

[profile.test.package.pictura_app]
opt-level = 2

# A Debug CMake configure links this staticlib with the dev profile (Corrosion's
# default mapping; optimized configures use `dev-app` below), so without these
# overrides every engine loop runs at opt-level 0 in a local build: a 4000x4000
# selection bounds scan cost 334 ms per pointer move and a mask content move
# 727 ms. Dependencies stay at 0 so the cold build does not pay for the whole
# graph. `pictura-app` is left unoptimised so the UI stays debuggable; its hot
# paths are bulk copies.
[profile.dev.package.pictura-core]
opt-level = 2

[profile.dev.package.pictura-codec]
opt-level = 2

[profile.dev.package.pictura-color]
opt-level = 2

[profile.dev.package.pictura-adjust]
opt-level = 2

[profile.dev.package.pictura-filters]
opt-level = 2

[profile.dev.package.pictura-ops]
opt-level = 2

[profile.dev.package.pictura-paint]
opt-level = 2

[profile.dev.package.pictura-select]
opt-level = 2

[profile.dev.package.pictura-render]
opt-level = 2

# The optimized development CMake build (BUILD_TESTING on, Release or
# RelWithDebInfo) compiles the staticlib with this profile. It inherits release,
# not dev: a panic inside a cxx-qt call aborts the process, so dev's overflow
# checks and debug assertions would crash the development app where the shipped
# build wraps. The speed comes from incremental compilation and more codegen
# units; line tables give panic backtraces line numbers. The app crate at
# opt-level 2 recompiles as fast as at 1 (measured).
[profile.dev-app]
inherits = "release"
incremental = true
codegen-units = 256
debug = "line-tables-only"

[profile.dev-app.package.pictura_app]
opt-level = 2
