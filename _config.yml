title: Kooka Pictura
description: Documentation-first reimplementation of Adobe Photoshop CS6 in Rust + Qt6 on Linux.

# The published site lives in site/; everything else is project source that
# Jekyll must not parse (Actions expressions like ${{ ... }} break Liquid).
exclude:
  - .cache
  - .cargo
  - .claude
  - .config
  - .githooks
  - .github
  - .opencode
  - .serena
  - build
  - crates
  - docs
  - LICENSES
  - openspec
  - packaging
  - scripts
  - target
  - THIRD-PARTY-LICENSES
