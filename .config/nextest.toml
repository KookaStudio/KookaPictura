[profile.default]
fail-fast = false
status-level = "all"
final-status-level = "all"
failure-output = "final"
success-output = "never"

# The heap-peak guards (#1210) each build 4250x4250 documents; two at a time
# keeps a runner's memory in bounds. Each still runs alone in its process,
# which is what makes its peak exact.
[test-groups]
memory-guards = { max-threads = 2 }

[[profile.default.overrides]]
filter = "package(pictura_app) & test(/heap_peak/)"
test-group = "memory-guards"

[profile.default.junit]
path = "junit.xml"
report-skipped = "ignored"

# The GPU parity run (`gpu-parity` CI job on lavapipe, or locally on any Vulkan
# or DX12 device):
#   cargo nextest run -p pictura-render --features software-gpu --profile gpu --run-ignored all
# Selects the device-dependent tests and the device-free GPU checks; the
# PICTURA_GPU_BENCH timing and profile evidence is excluded by name.
[profile.gpu]
fail-fast = false
status-level = "all"
final-status-level = "all"
failure-output = "final"
success-output = "never"
default-filter = """
package(pictura-render) & (
    binary(gpu_parity) | binary(gpu_filter_parity)
    | test(/^gpu(_filter)?::/) | test(/fixture_scene/)
) & !test(/timing|_1024_|over_1d_limit|full_4000|composite_profile/)
"""

[profile.gpu.junit]
path = "junit.xml"
report-skipped = "ignored"
