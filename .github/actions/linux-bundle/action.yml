name: linux-bundle
description: >-
  Release-build pictura and deploy it with its Qt and library dependencies into
  ./AppDir (usr/bin, usr/lib, usr/plugins, usr/share). appimage.yml packs that
  tree as an AppImage; linux-packages.yml repackages it as .deb and .rpm.
  Leaves ./linuxdeploy-x86_64.AppImage behind for the AppImage step.

runs:
  using: composite
  steps:
    - name: Install pinned toolchain
      shell: bash
      run: rustup show active-toolchain

    # libfuse2 lets the linuxdeploy AppImages run.
    - name: Install lld, ninja, lcms2, Vulkan headers, and FUSE
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y lld ninja-build liblcms2-dev libvulkan-dev libfuse2t64

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.11.1'
        cache: true

    # The workflows set RUSTC_WRAPPER/SCCACHE_GHA_ENABLED; this only installs
    # the binary (same action and version ci.yml uses).
    - name: Install sccache
      uses: mozilla-actions/sccache-action@v0.0.11

    - uses: Swatinem/rust-cache@v2
      with:
        cache-targets: "false"

    # No --locked: the Release PR bumps Cargo.toml but not Cargo.lock (DEVELOPING.md).
    - name: Build and stage the AppDir
      shell: bash
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
          -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_INSTALL_PREFIX=/usr \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        cmake --build build --parallel
        DESTDIR="$PWD/AppDir" cmake --install build

    # libvulkan and the GPU drivers stay on the host: wgpu dlopens them.
    - name: Deploy Qt and dependencies
      shell: bash
      env:
        QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        EXTRA_PLATFORM_PLUGINS: libqoffscreen.so
        # linuxdeploy's bundled strip cannot read RELR sections (newer toolchains).
        NO_STRIP: "1"
      run: |
        base=https://github.com/linuxdeploy
        curl -fsSLO "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
        curl -fsSLO "$base/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage"
        chmod +x linuxdeploy*.AppImage
        ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt
