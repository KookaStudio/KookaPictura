name: linux-bundle
description: >-
  Release-build pictura and deploy it with its Qt and library dependencies into
  ./AppDir (usr/bin, usr/lib, usr/plugins, usr/share). appimage.yml packs that
  tree as an AppImage; linux-packages.yml repackages it as .deb and .rpm.
  Leaves ./linuxdeploy-x86_64.AppImage behind for the AppImage step.

runs:
  using: composite
  steps:
    - name: Install pinned toolchain
      shell: bash
      run: rustup show active-toolchain

    # libfuse2 lets the linuxdeploy AppImages run.
    - name: Install lld, ninja, lcms2, Vulkan headers, and FUSE
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y lld ninja-build liblcms2-dev libvulkan-dev libfuse2t64

    - name: Install Qt
      uses: jurplel/install-qt-action@a9c63c7c123f3069cff414e7e482d95dfa9d8125 # v4 (branch head)
      with:
        version: '6.11.1'
        cache: true

    # The workflows set RUSTC_WRAPPER/SCCACHE_GHA_ENABLED; this only installs
    # the binary (same action and version ci.yml uses).
    - name: Install sccache
      uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      with:
        version: v0.18.0

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        cache-targets: "false"

    # No --locked: the Release PR bumps Cargo.toml but not Cargo.lock (DEVELOPING.md).
    - name: Build and stage the AppDir
      shell: bash
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
          -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -DCMAKE_INSTALL_PREFIX=/usr \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
        cmake --build build --parallel
        DESTDIR="$PWD/AppDir" cmake --install build

    # libvulkan and the GPU drivers stay on the host: wgpu dlopens them.
    - name: Deploy Qt and dependencies
      shell: bash
      env:
        QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        EXTRA_PLATFORM_PLUGINS: libqoffscreen.so
        # linuxdeploy's bundled strip cannot read RELR sections (newer toolchains).
        NO_STRIP: "1"
      run: |
        # Pinned releases, not :continuous, and verified before execution.
        ld_version=1-alpha-20251107-1
        ld_qt_version=1-alpha-20250213-1
        base=https://github.com/linuxdeploy
        curl -fsSL -o linuxdeploy-x86_64.AppImage \
          "$base/linuxdeploy/releases/download/$ld_version/linuxdeploy-x86_64.AppImage"
        curl -fsSL -o linuxdeploy-plugin-qt-x86_64.AppImage \
          "$base/linuxdeploy-plugin-qt/releases/download/$ld_qt_version/linuxdeploy-plugin-qt-x86_64.AppImage"
        echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy-x86_64.AppImage" | sha256sum -c -
        echo "15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt-x86_64.AppImage" | sha256sum -c -
        chmod +x linuxdeploy*.AppImage
        ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt
