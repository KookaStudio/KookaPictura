name: snap

# Builds the x86_64 snap for a release tag and attaches it to that release.
# Same shape as appimage.yml: release-please.yml calls it after cutting a
# release, it runs by hand for an existing tag, and the release-please Release PR
# runs it as a dry run that keeps the .snap as a workflow artifact. Feature PRs
# never run it.
on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - CMakeLists.txt
      - CHANGELOG.md
      - version.txt
      - .release-please-manifest.json
      - snap/**
      - packaging/**
      - .github/workflows/snap.yml
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.1.0 (a leading v is added if omitted)
        type: string
        required: true

concurrency:
  group: snap-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Release uploads live in their own job; a pull-request dry run is read-only.
permissions:
  contents: read

jobs:
  snap:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name != 'pull_request' ||
      (github.head_ref == 'release-please--branches--master' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    # snapcraft builds inside an LXD container; allow for the cold toolchain and
    # the full Rust + C++ build.
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag }}
      EXPECTED_TAG: ${{ inputs.tag != '' && (startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag)) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag != '' && (startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag)) || github.sha }}

      # The snap version comes from version.txt (adopt-info), so write the same
      # dry-run version the other packagers use before snapcraft copies the tree.
      - name: Use the dry-run version
        if: github.event_name == 'pull_request'
        run: echo "0.0.0~pr${{ github.event.number }}" > version.txt

      # version.txt is the version of record; a tag that disagrees would publish
      # a snap whose version does not match the release.
      - name: Check the tag matches version.txt
        if: inputs.tag != ''
        run: |
          actual="v$(cat version.txt)"
          if [ "$actual" != "$EXPECTED_TAG" ]; then
            echo "::error::version.txt says $actual but the requested tag is $EXPECTED_TAG"
            exit 1
          fi

      # The LXD build environment, the Qt6 SDK snap, and the Rust toolchain share
      # the runner's ~14 GB disk. Drop the preinstalled toolchains we do not use.
      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android \
            /usr/share/dotnet /opt/ghc /usr/local/share/boost
          df -h /

      - name: Build the snap
        id: build
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1

      # Install the snap and run the app's headless self-test under strict
      # confinement. A strict failure is re-run in devmode only to tell a broken
      # build apart from a confinement gap; the strict self-test is the contract,
      # so the step still fails.
      - name: Smoke-check the snap
        run: |
          SNAP="${{ steps.build.outputs.snap }}"
          if sudo snap install --dangerous "$SNAP" \
             && kooka-pictura.pictura --headless --self-test; then
            exit 0
          fi
          sudo snap remove kooka-pictura || true
          sudo snap install --dangerous --devmode "$SNAP"
          kooka-pictura.pictura --headless --self-test || true
          echo "::error::the snap self-test did not pass under strict confinement"
          exit 1

      - name: Keep the snap
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
          retention-days: 7
          if-no-files-found: error

  upload:
    runs-on: ubuntu-24.04
    needs: snap
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag != '' && (startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag)) || '' }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: snap

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" *.snap --clobber
