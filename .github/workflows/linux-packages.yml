name: linux-packages

# Builds the x86_64 .deb and .rpm for a release tag and attaches them to that
# release. Same shape as appimage.yml: release-please.yml calls it after cutting
# a release, it runs by hand for an existing tag, and the release-please Release
# PR runs it as a dry run that keeps the packages as workflow artifacts.
# Feature PRs never run it. Each package is smoke-checked by installing it into
# a clean distro container, which also proves its dependency list resolves there.
on:
  pull_request:
    paths: ['**']
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.1.0 (a leading v is added if omitted)
        type: string
        required: true

concurrency:
  group: linux-packages-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Release uploads live in their own job; a pull-request dry run is read-only.
permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref == 'ci/703-release-build-hardening' ||
      (github.head_ref == 'release-please--branches--master' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.tag || format('0.0.0~pr{0}', github.event.number) }}
      # sccache, the same setup ci.yml uses.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag != '' && (startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag)) || github.sha }}

      - uses: ./.github/actions/linux-bundle

      - name: Build .deb and .rpm
        run: |
          sudo apt-get install -y dpkg-dev rpm
          mkdir -p dist
          bash packaging/build-packages.sh "$VERSION" AppDir dist

      - name: Smoke-check the .deb on Ubuntu 24.04
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" ubuntu:24.04 bash -ec '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /dist/*.deb
            for f in /usr/share/doc/kooka-pictura/copyright \
                     /usr/share/metainfo/pictura.metainfo.xml; do
              if [ ! -f "$f" ]; then echo "missing $f"; dpkg -L kooka-pictura; exit 1; fi
            done
            pictura --headless --self-test'

      - name: Smoke-check the .rpm on Fedora
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:latest bash -ec '
            dnf install -y -q /dist/*.rpm
            for f in /usr/share/doc/kooka-pictura/copyright \
                     /usr/share/metainfo/pictura.metainfo.xml; do
              if [ ! -f "$f" ]; then echo "missing $f"; rpm -ql kooka-pictura; exit 1; fi
            done
            pictura --headless --self-test'

      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-packages
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  upload:
    runs-on: ubuntu-24.04
    needs: packages
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag != '' && (startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag)) || '' }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: linux-packages
          path: dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
