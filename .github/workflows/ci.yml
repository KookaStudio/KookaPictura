name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '**/*.md'
      - '.serena/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '**/*.md'
      - '.serena/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cpp_only: ${{ steps.bucket.outputs.cpp_only }}
      render: ${{ steps.filter.outputs.render }}
    steps:
      # Explicit, not *checkout: this job precedes the anchor's definition.
      - uses: actions/checkout@v7
      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          list-files: shell
          filters: |
            changed:
              - '**'
            render:
              - 'crates/pictura-render/**'
              - 'crates/pictura-core/**'
              - 'crates/pictura-codec/**'
              - 'crates/pictura-color/**'
              - 'crates/pictura-adjust/**'
              - 'crates/pictura-filters/**'
              - 'crates/pictura-ops/**'
              - 'crates/pictura-paint/**'
              - 'crates/pictura-select/**'
              - 'crates/pictura-testkit/**'
              - 'crates/pictura-app/src/gpu*'
              - 'crates/pictura-app/Cargo.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
      - name: Classify the change
        id: bucket
        env:
          FILES: ${{ steps.filter.outputs.changed_files }}
        run: |
          cpp_only=false
          if [ -n "$FILES" ]; then
            cpp_only=true
            # ponytail: odd filenames in the shell list fail the match below,
            # yielding cpp_only=false and a full run (fail open, never a bad skip)
            for f in $FILES; do
              case "$f" in
                crates/pictura-app/cpp/*) ;;
                *) cpp_only=false; break ;;
              esac
            done
          fi
          echo "cpp_only=$cpp_only" >> "$GITHUB_OUTPUT"

  lint:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.cpp_only != 'true'
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@v7

      # Reads rust-toolchain.toml (channel 1.98) and installs it on the runner.
      - &toolchain
        name: Install pinned toolchain
        run: rustup show active-toolchain

      - &apt
        name: Install lld, mold, ninja, lcms2, Vulkan headers, and the PDF oracle tools
        run: sudo apt-get update && sudo apt-get install -y lld mold ninja-build liblcms2-dev libvulkan-dev poppler-utils ghostscript qpdf

      - &qt
        name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          cache: true

      - &sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # lint and test restore their compiled targets, so an unchanged
      # dependency graph is not recompiled on every run. Only master saves, to
      # keep the shared Actions cache quota for the default branch.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "true"
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The GPU parity feature's code, linted here so gpu-parity only runs tests.
      - name: Clippy with software-gpu
        run: cargo clippy -p pictura-render --all-targets --features software-gpu -- -D warnings

      - name: Install cargo-deny
        if: ${{ hashFiles('deny.toml') != '' }}
        uses: taiki-e/install-action@cargo-deny

      - name: Deny
        if: ${{ hashFiles('deny.toml') != '' }}
        run: cargo deny check

  test:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.cpp_only != 'true'
    timeout-minutes: 30
    steps:
      - *checkout
      - *toolchain
      - *apt
      - *qt
      - *sccache

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "true"
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: taiki-e/install-action@nextest

      # The external oracles: without these tools the oracle tests self-skip.
      # The AppImage is cached in the runner user's home, since a cache restore
      # into /opt would lack permissions, and extracted on every run.
      - name: Cache ImageMagick
        uses: actions/cache@v6
        with:
          path: ~/.cache/imagemagick
          key: imagemagick-7.1.2-31

      - name: Install ImageMagick 7
        run: |
          appimage=~/.cache/imagemagick/ImageMagick-7.1.2-31-gcc-x86_64.AppImage
          if [ ! -f "$appimage" ]; then
            mkdir -p ~/.cache/imagemagick
            curl -fsSL -o "$appimage" \
              https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-31/ImageMagick-7.1.2-31-gcc-x86_64.AppImage
          fi
          chmod +x "$appimage"
          ( cd "$RUNNER_TEMP" && "$appimage" --appimage-extract >/dev/null )
          sudo mv "$RUNNER_TEMP/squashfs-root" /opt/imagemagick
          sudo tee /usr/local/bin/magick >/dev/null <<'EOF'
          #!/usr/bin/env bash
          exec /opt/imagemagick/AppRun "$@"
          EOF
          sudo chmod +x /usr/local/bin/magick
          magick -version

      - name: Install psd-tools
        run: python3 -m pip install --user --break-system-packages "psd-tools>=1.19"

      # Installed outside the checkout; the ag-psd oracle resolves it via NODE_PATH.
      - name: Install ag-psd
        run: npm i --no-save --prefix "$RUNNER_TEMP/agpsd" ag-psd@34.1.0

      - name: Test
        run: cargo nextest run --workspace
        env:
          NODE_PATH: ${{ runner.temp }}/agpsd/node_modules

      - name: Upload nextest JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextest-junit
          path: target/nextest/default/junit.xml

  # GPU parity on Mesa's lavapipe: the software Vulkan device the
  # `software-gpu` feature lets the probe accept. The tests it runs are
  # #[ignore]d elsewhere, so a runner without the device fails here.
  gpu-parity:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.cpp_only != 'true'
    timeout-minutes: 30
    steps:
      - *checkout
      - *toolchain
      - *apt

      - name: Install the software Vulkan driver
        run: sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      - *sccache
      # gpu-parity and qt-headless cache only the registry; qt-headless builds
      # its Rust through Corrosion into the CMake tree, outside target/.
      - &rustcache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - uses: taiki-e/install-action@nextest

      - name: GPU parity
        run: cargo nextest run -p pictura-render --features software-gpu --profile gpu --run-ignored all

      - name: Upload GPU JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-parity-junit
          path: target/nextest/gpu/junit.xml

  # Windows compile/test for the wgpu backend chain. The release windows.yml
  # only runs on the Release PR, so a Windows-only break in pictura-render
  # otherwise reaches a release before it is seen. No Qt: pictura-render does
  # not link it. The C++ shell is still covered only by the release workflow.
  windows-render:
    runs-on: windows-2022
    needs: changes
    if: needs.changes.outputs.render == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Reads rust-toolchain.toml and installs it, with clippy.
      - name: Install pinned toolchain
        run: rustup show active-toolchain

      # Puts cl.exe/link.exe and the Windows SDK on PATH: lcms2-sys builds its
      # vendored C fallback and rustc links the test binaries with MSVC.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # v0.18.0 speaks the GitHub Actions cache v2 backend on Windows.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: "true"
          shared-key: windows-render
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Clippy
        run: cargo clippy -p pictura-render --all-targets -- -D warnings

      - name: Test
        run: cargo test -p pictura-render --lib --test backend_pin --test backend_cpu

      - uses: taiki-e/install-action@nextest

      # WARP is the runner's only DX12 adapter; the software-gpu feature lets
      # the probe accept it so the real compositor and filter shaders compile
      # with FXC and match the CPU oracle.
      - name: GPU parity on WARP
        run: cargo nextest run -p pictura-render --features software-gpu --profile gpu --run-ignored all


  qt-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - *checkout
      - *toolchain
      - *apt
      - *qt
      - *sccache
      - *rustcache

      - name: Configure
        # CI compiles every source without precompiled headers, so a header a
        # local precompiled header would mask cannot break the release build.
        run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Self-test
        run: ./build/pictura --headless --self-test

      - name: Self-test with document
        run: ./build/pictura --headless --self-test crates/pictura-codec/tests/fixtures/two_layers.psd

      - name: CTest
        run: |
          # The runner runs nothing else here, so every CPU takes a suite.
          level="${CTEST_PARALLEL_LEVEL:-$(nproc)}"
          echo "ctest -j $level"
          ctest --test-dir build --output-on-failure -j "$level"

      - name: Qt test report
        if: always()
        run: |
          shopt -s nullglob
          files=(build/qt-test-results/*.xml)
          if [ ${#files[@]} -gt 0 ]; then
            python3 scripts/report_tests.py --qt-junit "${files[@]}" --color never
          else
            echo "no Qt test results to report"
          fi

      - name: Control e2e
        run: bash scripts/verify-control.sh
