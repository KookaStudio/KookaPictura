name: CI

on:
  workflow_dispatch:
    inputs:
      force_cold:
        description: Bypass the Qt build-tree cache restore
        type: boolean
        default: false
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '**/*.md'
      - '.serena/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - '**/*.md'
      - '.serena/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cpp_only: ${{ steps.bucket.outputs.cpp_only }}
      render: ${{ steps.filter.outputs.render }}
      change_classes: ${{ steps.bucket.outputs.change_classes }}
    steps:
      # Explicit, not *checkout: this job precedes the anchor's definition.
      - uses: actions/checkout@v7
      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          list-files: shell
          base: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          filters: |
            changed:
              - '**'
            render:
              - 'crates/pictura-render/**'
              - 'crates/pictura-core/**'
              - 'crates/pictura-codec/**'
              - 'crates/pictura-color/**'
              - 'crates/pictura-adjust/**'
              - 'crates/pictura-filters/**'
              - 'crates/pictura-ops/**'
              - 'crates/pictura-paint/**'
              - 'crates/pictura-select/**'
              - 'crates/pictura-testkit/**'
              - 'crates/pictura-app/src/gpu*'
              - 'crates/pictura-app/Cargo.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/workflows/ci.yml'
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'crates/**/*.rs'
            shell_headers:
              - 'crates/pictura-app/cpp/**/*.h'
            qt_tests:
              - 'crates/pictura-app/cpp/tests/**'
            build_inputs:
              - 'CMakeLists.txt'
              - 'cmake/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'crates/*/Cargo.toml'
              - 'crates/pictura-app/build.rs'
              - 'crates/pictura-app/bridge_sources.txt'
              - 'crates/pictura-app/cpp/tests/CMakeLists.txt'
              - '.github/workflows/ci.yml'
              - 'scripts/ci_build_cache.py'
      - name: Classify the change
        id: bucket
        env:
          FILES: ${{ steps.filter.outputs.changed_files }}
          RUST_CHANGED: ${{ steps.filter.outputs.rust }}
          SHELL_HEADERS_CHANGED: ${{ steps.filter.outputs.shell_headers }}
          QT_TESTS_CHANGED: ${{ steps.filter.outputs.qt_tests }}
          BUILD_INPUTS_CHANGED: ${{ steps.filter.outputs.build_inputs }}
        run: |
          cpp_only=false
          if [ -n "$FILES" ]; then
            cpp_only=true
            # ponytail: odd filenames in the shell list fail the match below,
            # yielding cpp_only=false and a full run (fail open, never a bad skip)
            for f in $FILES; do
              case "$f" in
                crates/pictura-app/cpp/*) ;;
                *) cpp_only=false; break ;;
              esac
            done
          fi
          echo "cpp_only=$cpp_only" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import os
          from pathlib import Path

          changed = os.environ["FILES"].split()
          bridges = {
              line.strip()
              for line in Path("crates/pictura-app/bridge_sources.txt").read_text().splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          }
          classes = []
          if os.environ["BUILD_INPUTS_CHANGED"] == "true":
              classes.append("build-input")
          if any(f"crates/pictura-app/{path}" in changed for path in bridges):
              classes.append("bridge-file")
          if os.environ["RUST_CHANGED"] == "true":
              classes.append("rust")
          if os.environ["SHELL_HEADERS_CHANGED"] == "true":
              classes.append("shell-header")
          if os.environ["QT_TESTS_CHANGED"] == "true":
              classes.append("qt-test")
          if changed and not classes:
              classes.append("other")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("change_classes=" + ",".join(classes or ["none"]) + "\n")
          PY

  lint:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.cpp_only != 'true'
    timeout-minutes: 30
    steps:
      - &checkout
        uses: actions/checkout@v7

      # Reads rust-toolchain.toml (channel 1.98) and installs it on the runner.
      - &toolchain
        name: Install pinned toolchain
        run: rustup show active-toolchain

      - &apt
        name: Install lld, mold, ninja, lcms2, Vulkan headers, and the PDF oracle tools
        run: sudo apt-get update && sudo apt-get install -y lld mold ninja-build liblcms2-dev libvulkan-dev poppler-utils ghostscript qpdf

      - &qt
        name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          cache: true

      - &sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # lint and test restore their compiled targets, so an unchanged
      # dependency graph is not recompiled on every run. Only master saves, to
      # keep the shared Actions cache quota for the default branch.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "true"
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The GPU parity feature's code, linted here so gpu-parity only runs tests.
      - name: Clippy with software-gpu
        run: cargo clippy -p pictura-render --all-targets --features software-gpu -- -D warnings

      - name: Install cargo-deny
        if: ${{ hashFiles('deny.toml') != '' }}
        uses: taiki-e/install-action@cargo-deny

      - name: Deny
        if: ${{ hashFiles('deny.toml') != '' }}
        run: cargo deny check

  test:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.cpp_only != 'true'
    timeout-minutes: 45
    steps:
      - *checkout
      - *toolchain
      - *apt
      - *qt
      - *sccache

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "true"
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - uses: taiki-e/install-action@nextest

      # The external oracles: without these tools the oracle tests self-skip.
      # The AppImage is cached in the runner user's home, since a cache restore
      # into /opt would lack permissions, and extracted on every run.
      - name: Cache ImageMagick
        uses: actions/cache@v6
        with:
          path: ~/.cache/imagemagick
          key: imagemagick-7.1.2-31

      - name: Install ImageMagick 7
        run: |
          appimage=~/.cache/imagemagick/ImageMagick-7.1.2-31-gcc-x86_64.AppImage
          if [ ! -f "$appimage" ]; then
            mkdir -p ~/.cache/imagemagick
            curl -fsSL -o "$appimage" \
              https://github.com/ImageMagick/ImageMagick/releases/download/7.1.2-31/ImageMagick-7.1.2-31-gcc-x86_64.AppImage
          fi
          chmod +x "$appimage"
          ( cd "$RUNNER_TEMP" && "$appimage" --appimage-extract >/dev/null )
          sudo mv "$RUNNER_TEMP/squashfs-root" /opt/imagemagick
          sudo tee /usr/local/bin/magick >/dev/null <<'EOF'
          #!/usr/bin/env bash
          exec /opt/imagemagick/AppRun "$@"
          EOF
          sudo chmod +x /usr/local/bin/magick
          magick -version

      - name: Install psd-tools
        run: python3 -m pip install --user --break-system-packages "psd-tools>=1.19"

      # Installed outside the checkout; the ag-psd oracle resolves it via NODE_PATH.
      - name: Install ag-psd
        run: npm i --no-save --prefix "$RUNNER_TEMP/agpsd" ag-psd@34.1.0

      - name: Verify the renderer oracle is excluded from normal app builds
        run: |
          python3 scripts/check-view-oracle.py --self-check
          for profile in release dev-app; do
            report="$RUNNER_TEMP/view-oracle-$profile.jsonl"
            cargo build -p pictura_app --lib --profile "$profile" --message-format=json > "$report"
            python3 scripts/check-view-oracle.py --profile "$profile" "$report"
          done

      - name: Renderer tests without the oracle feature
        run: cargo nextest run -p pictura-render

      - name: Test
        run: cargo nextest run --workspace
        env:
          NODE_PATH: ${{ runner.temp }}/agpsd/node_modules

      - name: Upload nextest JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nextest-junit
          path: target/nextest/default/junit.xml

      - name: Upload oracle build reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: view-oracle-build-reports
          path: ${{ runner.temp }}/view-oracle-*.jsonl

  # GPU parity on Mesa's lavapipe: the software Vulkan device the
  # `software-gpu` feature lets the probe accept. The tests it runs are
  # #[ignore]d elsewhere, so a runner without the device fails here.
  gpu-parity:
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.cpp_only != 'true'
    timeout-minutes: 30
    steps:
      - *checkout
      - *toolchain
      - *apt

      - name: Install the software Vulkan driver
        run: sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      - *sccache
      # gpu-parity and qt-headless cache only the registry; qt-headless builds
      # its Rust through Corrosion into the CMake tree, outside target/.
      - &rustcache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - uses: taiki-e/install-action@nextest

      - name: GPU parity
        run: cargo nextest run -p pictura-render --features software-gpu --profile gpu --run-ignored all

      - name: Upload GPU JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-parity-junit
          path: target/nextest/gpu/junit.xml

  # Windows compile/test for the wgpu backend chain. The release windows.yml
  # only runs on the Release PR, so a Windows-only break in pictura-render
  # otherwise reaches a release before it is seen. No Qt: pictura-render does
  # not link it. The C++ shell is still covered only by the release workflow.
  windows-render:
    runs-on: windows-2022
    needs: changes
    if: needs.changes.outputs.render == 'true'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Reads rust-toolchain.toml and installs it, with clippy.
      - name: Install pinned toolchain
        run: rustup show active-toolchain

      # Puts cl.exe/link.exe and the Windows SDK on PATH: lcms2-sys builds its
      # vendored C fallback and rustc links the test binaries with MSVC.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      # v0.18.0 speaks the GitHub Actions cache v2 backend on Windows.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.18.0

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-targets: "true"
          shared-key: windows-render
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Clippy
        run: cargo clippy -p pictura-render --all-targets -- -D warnings

      # The DX12 backend and the gated test targets only compile on Windows with
      # the feature on, so this is the only place they are linted.
      - name: Clippy with software-gpu
        run: cargo clippy -p pictura-render --all-targets --features software-gpu -- -D warnings

      # The GPU-gated library tests stay out of the WARP run (the full compositor
      # validation loses the device there); the two device-free backend binaries
      # need the feature to compile but must not accept the WARP software device,
      # so they run with `gpu` alone — the same device-free behaviour as before.
      - name: Test
        run: |
          cargo test -p pictura-render --lib
          cargo test -p pictura-render --test backend_pin --test backend_cpu --features gpu

      # WARP is the runner's only DX12 adapter. The software-gpu feature lets
      # the device come up; the full compositor validation loses the WARP
      # device, so this job checks device creation and the FXC policy only.
      # The full GPU parity suite runs on lavapipe in the gpu-parity job.
      - name: DX12 device smoke on WARP
        run: cargo test -p pictura-render --lib --features software-gpu dx12_device_comes_up_with_fxc


  qt-headless:
    runs-on: ubuntu-24.04
    needs: changes
    permissions:
      contents: read
      actions: read
    # Cold dependency setup and the build can fill 30 minutes before CTest starts.
    timeout-minutes: 45
    steps:
      - *checkout
      - *toolchain
      - *apt
      - name: Install Qt with TIFF support
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          modules: qtimageformats
          cache: true
      - *sccache
      - *rustcache

      - name: Build cache helper self-test
        run: python3 scripts/ci_build_cache.py --self-test

      - name: Build cache identity
        id: identity
        run: |
          python3 scripts/ci_build_cache.py identity \
            --runner-image ubuntu-24.04 \
            --fingerprint-file "$RUNNER_TEMP/qt-build-fingerprint.txt" \
            --github-output "$GITHUB_OUTPUT"

      - name: Start Qt build cache restore timer
        if: ${{ !inputs.force_cold }}
        run: date +%s%N > "$RUNNER_TEMP/qt-cache-restore-start"

      - name: Restore Qt build tree
        id: build_cache
        if: ${{ !inputs.force_cold }}
        continue-on-error: true
        uses: actions/cache/restore@v6
        with:
          path: build
          key: ${{ steps.identity.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.identity.outputs.prefix }}

      - name: Record Qt build cache restore time
        id: restore_time
        if: always()
        env:
          CACHE_MATCHED_KEY: ${{ steps.build_cache.outputs.cache-matched-key }}
        run: |
          seconds=0
          if [ -n "$CACHE_MATCHED_KEY" ] && [ -f "$RUNNER_TEMP/qt-cache-restore-start" ]; then
            start=$(cat "$RUNNER_TEMP/qt-cache-restore-start")
            end=$(date +%s%N)
            seconds=$(python3 -c 'import sys; print((int(sys.argv[2]) - int(sys.argv[1])) / 1_000_000_000)' "$start" "$end")
          fi
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"

      - name: Validate Qt build tree cache
        id: cache_state
        env:
          CACHE_MATCHED_KEY: ${{ steps.build_cache.outputs.cache-matched-key }}
          FORCE_COLD: ${{ inputs.force_cold }}
          FINGERPRINT: ${{ steps.identity.outputs.fingerprint }}
        run: |
          state=miss
          validation_seconds=0
          restored_bytes=0
          if [ "$FORCE_COLD" = "true" ]; then
            state=forced-cold
            rm -rf build
          elif [ -n "$CACHE_MATCHED_KEY" ]; then
            restored_bytes=0
            if [ -d build ]; then
              restored_bytes=$(du -sb build | awk '{print $1}')
            fi
            start=$(date +%s%N)
            if python3 scripts/ci_build_cache.py restore --fingerprint "$FINGERPRINT"; then
              state=hit
            else
              state=stale-rejected
              rm -rf build
            fi
            end=$(date +%s%N)
            validation_seconds=$(python3 -c 'import sys; print((int(sys.argv[2]) - int(sys.argv[1])) / 1_000_000_000)' "$start" "$end")
          fi
          {
            echo "state=$state"
            echo "validation_seconds=$validation_seconds"
            echo "restored_bytes=$restored_bytes"
          } >> "$GITHUB_OUTPUT"

      - name: Provide the TIFF runtime for Qt
        # The runtime must exist before the shared executor reaches CTest,
        # because CTest inherits LD_LIBRARY_PATH from the step that runs it.
        run: |
          # The Linux Qt SDK builds libqtiff against RHEL's libtiff.so.5.
          tiff_package="$RUNNER_TEMP/libtiff5.deb"
          curl --fail --silent --show-error --location --retry 3 \
            https://snapshot.ubuntu.com/ubuntu/20261121T000000Z/pool/main/t/tiff/libtiff5_4.3.0-6ubuntu0.13_amd64.deb \
            --output "$tiff_package"
          printf '%s  %s\n' 298a778a6a579a556f6bb4e32512cd76e0483b57b4a379ee85397f62fe21f225 "$tiff_package" | sha256sum --check --status
          dpkg-deb --extract "$tiff_package" "$RUNNER_TEMP/qt-tiff"

      - name: Qt execution self-check
        run: python3 scripts/test_report_execution.py --self-check

      - name: Configure, build, self-test, CTest, report
        # One shared Qt executor owns the stage order; CI keeps only the setup
        # above. It requests the whole runner CPU count, and an explicit
        # CTEST_PARALLEL_LEVEL still wins. CI compiles every source without
        # precompiled headers, so a header a local PCH would mask cannot reach
        # the release build.
        run: |
          export LD_LIBRARY_PATH="$RUNNER_TEMP/qt-tiff/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PICTURA_CPU_BUDGET_PERCENT=100
          export PICTURA_CTEST_REGISTRATION_FILE="$RUNNER_TEMP/qt-ctest.json"
          set -o pipefail
          bash scripts/test-report.sh never --qt-only --configure --build \
            --cmake-arg -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            --cmake-arg -DBUILD_TESTING=ON \
            --cmake-arg -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            --cmake-arg -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON \
            --cmake-arg "-DFETCHCONTENT_BASE_DIR=$GITHUB_WORKSPACE/build/fetchcontent" \
            2>&1 | tee "$RUNNER_TEMP/qt-build.log"

      - name: Measure Qt build
        id: build_measure
        if: ${{ always() && !cancelled() }}
        run: |
          if [ ! -f "$RUNNER_TEMP/qt-build.log" ]; then exit 0; fi
          python3 scripts/ci_build_cache.py build-summary \
            --log "$RUNNER_TEMP/qt-build.log" --github-output "$GITHUB_OUTPUT"
          stats="$RUNNER_TEMP/qt-sccache-stats.txt"
          sccache --show-stats >"$stats" 2>&1 || true
          cat "$stats"
          hits=$(awk '$1=="Cache" && $2=="hits" && $3 ~ /^[0-9]+$/ {print $3}' "$stats")
          misses=$(awk '$1=="Cache" && $2=="misses" && $3 ~ /^[0-9]+$/ {print $3}' "$stats")
          rate=$(python3 - "${hits:-0}" "${misses:-0}" <<'PY'
          import sys
          hits, misses = map(int, sys.argv[1:])
          total = hits + misses
          print(f"{100 * hits / total:.3f}" if total else "0")
          PY
          )
          echo "sccache_hits=${hits:-0}" >> "$GITHUB_OUTPUT"
          echo "sccache_misses=${misses:-0}" >> "$GITHUB_OUTPUT"
          echo "sccache_hit_rate_percent=$rate" >> "$GITHUB_OUTPUT"

      - name: Upload Qt Test timing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qt-test-timings
          path: |
            build/qt-test-results/*.xml
            build/ctest-junit.xml
            build/qt-test-timings.json
          if-no-files-found: warn

      - name: Verify the shard plan and Qt fixed waits
        if: always()
        run: |
          python3 scripts/qt_test_timings.py verify --plan cmake/qt-test-shards.json
          python3 scripts/check-qt-test-waits.py

      - name: Control e2e
        run: bash scripts/verify-control.sh

      - name: Prepare Qt build tree cache
        id: cache_prep
        if: ${{ github.ref == 'refs/heads/master' }}
        env:
          CACHE_KEY: ${{ steps.identity.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          FINGERPRINT: ${{ steps.identity.outputs.fingerprint }}
        run: |
          rm -rf build/qt-test-results build/Testing
          python3 scripts/ci_build_cache.py write-manifest \
            --fingerprint "$FINGERPRINT" \
            --cache-key "$CACHE_KEY" \
            --source-commit "$GITHUB_SHA" \
            --ctest-json "$RUNNER_TEMP/qt-ctest.json"
          du -sb build | awk '{print "saved_bytes=" $1}' >> "$GITHUB_OUTPUT"

      - name: Start Qt build cache save timer
        if: ${{ github.ref == 'refs/heads/master' }}
        run: date +%s%N > "$RUNNER_TEMP/qt-cache-save-start"

      - name: Save Qt build tree
        id: cache_save
        if: ${{ github.ref == 'refs/heads/master' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: build
          key: ${{ steps.identity.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}

      - name: Record Qt build cache save timing
        id: save_time
        if: always()
        run: |
          upload_seconds=0
          if [ -f "$RUNNER_TEMP/qt-cache-save-start" ]; then
            start=$(cat "$RUNNER_TEMP/qt-cache-save-start")
            end=$(date +%s%N)
            upload_seconds=$(python3 -c 'import sys; print((int(sys.argv[2]) - int(sys.argv[1])) / 1_000_000_000)' "$start" "$end")
          fi
          echo "upload_seconds=$upload_seconds" >> "$GITHUB_OUTPUT"

      - name: Record saved Qt cache archive size
        id: cache_size
        if: ${{ github.ref == 'refs/heads/master' && steps.cache_save.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_KEY: ${{ steps.identity.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          size=""
          for delay in 5 10 20 30; do
            size=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/caches" \
              -f key="$CACHE_KEY" -f per_page=100 \
              --jq '.actions_caches[] | select(.key == env.CACHE_KEY) | .size_in_bytes' || true)
            if [ -n "$size" ]; then
              break
            fi
            sleep "$delay"
          done
          echo "archive_bytes=${size:-unavailable}" >> "$GITHUB_OUTPUT"

      - name: Publish Qt build cache measurements
        if: always()
        env:
          CHANGE_CLASSES: ${{ needs.changes.outputs.change_classes }}
          CACHE_STATE: ${{ steps.cache_state.outputs.state }}
          CACHE_MATCHED_KEY: ${{ steps.build_cache.outputs.cache-matched-key }}
          CACHE_KEY: ${{ steps.identity.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          RESTORED_BYTES: ${{ steps.cache_state.outputs.restored_bytes }}
          SAVED_BYTES: ${{ steps.cache_prep.outputs.saved_bytes }}
          ARCHIVE_BYTES: ${{ steps.cache_size.outputs.archive_bytes }}
          RESTORE_SECONDS: ${{ steps.restore_time.outputs.seconds }}
          VALIDATION_SECONDS: ${{ steps.cache_state.outputs.validation_seconds }}
          UPLOAD_SECONDS: ${{ steps.save_time.outputs.upload_seconds }}
          CACHE_SAVE_OUTCOME: ${{ steps.cache_save.outcome }}
          BUILD_DURATION_SECONDS: ${{ steps.build_measure.outputs.duration_seconds }}
          NINJA_EDGES: ${{ steps.build_measure.outputs.ninja_edges }}
          SCCACHE_HITS: ${{ steps.build_measure.outputs.sccache_hits }}
          SCCACHE_MISSES: ${{ steps.build_measure.outputs.sccache_misses }}
          SCCACHE_HIT_RATE: ${{ steps.build_measure.outputs.sccache_hit_rate_percent }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def integer(name):
              value = os.environ.get(name, "")
              return int(value) if value.isdigit() else None

          def decimal(name):
              value = os.environ.get(name, "")
              try:
                  return float(value) if value else None
              except ValueError:
                  return None

          metrics = {
              "run_id": os.environ["GITHUB_RUN_ID"],
              "sha": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "change_classes": os.environ.get("CHANGE_CLASSES") or "unavailable",
              "cache_state": os.environ.get("CACHE_STATE") or "unavailable",
              "cache_matched_key": os.environ.get("CACHE_MATCHED_KEY") or None,
              "cache_key": os.environ.get("CACHE_KEY") or None,
              "restored_uncompressed_bytes": integer("RESTORED_BYTES"),
              "saved_uncompressed_bytes": integer("SAVED_BYTES"),
              "saved_archive_bytes": integer("ARCHIVE_BYTES"),
              "restore_seconds": decimal("RESTORE_SECONDS"),
              "validation_seconds": decimal("VALIDATION_SECONDS"),
              "upload_seconds": decimal("UPLOAD_SECONDS"),
              "cache_save_outcome": os.environ.get("CACHE_SAVE_OUTCOME") or "skipped",
              "build_duration_seconds": decimal("BUILD_DURATION_SECONDS"),
              "ninja_edges": integer("NINJA_EDGES"),
              "sccache_hits": integer("SCCACHE_HITS"),
              "sccache_misses": integer("SCCACHE_MISSES"),
              "sccache_hit_rate_percent": decimal("SCCACHE_HIT_RATE"),
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "qt-build-cache-metrics.json"
          output.write_text(json.dumps(metrics, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              handle.write("### Qt build-tree cache\n\n")
              handle.write("| Metric | Value |\n|---|---|\n")
              for name, value in metrics.items():
                  handle.write(f"| {name} | {value if value is not None else 'n/a'} |\n")
          PY

      - name: Upload Qt build cache measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qt-build-cache-metrics
          path: ${{ runner.temp }}/qt-build-cache-metrics.json
          if-no-files-found: error
