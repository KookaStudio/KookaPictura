name: guards

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenSpec
        run: npm i -g @fission-ai/openspec@1.13.2
      - name: Non-goal guard
        env:
          GUARD_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/guard.sh
      - name: Test plan
        env:
          GUARD_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth=1 origin "$GUARD_BASE"
          python3 scripts/check-test-plan.py --self-test
          python3 scripts/check-test-plan.py
      - name: File size
        run: bash scripts/check-file-size.sh
      - name: Self-test budget
        run: bash scripts/check-selftest-budget.sh
      - name: Worktree hook
        run: bash scripts/check-worktree-hook.sh
      - name: Local build caching
        run: bash scripts/check-local-build-caching.sh
      - name: OpenSpec validation
        run: openspec validate --all --strict
      - name: OpenSpec archive
        run: |
          bash scripts/check-openspec-archived.sh --self-test
          bash scripts/check-openspec-archived.sh
