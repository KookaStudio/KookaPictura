name: appimage

# Builds the x86_64 AppImage for a release tag and attaches it to that release.
# release-please.yml calls this after it cuts a release (a release created with
# GITHUB_TOKEN cannot trigger a `release:` workflow). Run it by hand to rebuild
# or re-upload the asset for an existing tag. The release-please Release PR runs
# the same build as a dry run and keeps the AppImage as a workflow artifact.
# Feature PRs never run it.
on:
  pull_request:
    paths:
      - Cargo.toml
      - CMakeLists.txt
      - CHANGELOG.md
      - version.txt
      - .release-please-manifest.json
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.1.0
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name != 'pull_request' || github.head_ref == 'release-please--branches--master'
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.tag || format('pr{0}', github.event.number) }}
      # sccache, the same setup ci.yml uses.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: ./.github/actions/linux-bundle

      - name: Pack the AppImage
        env:
          NO_STRIP: "1"
        run: |
          OUTPUT="KookaPictura-${VERSION#v}-x86_64.AppImage" \
            ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage

      - name: Smoke-check the packaged binary
        run: APPIMAGE_EXTRACT_AND_RUN=1 ./KookaPictura-*-x86_64.AppImage --headless --self-test

      - name: Keep the dry-run AppImage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: KookaPictura-*-x86_64.AppImage
          retention-days: 7

      - name: Upload release assets
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" KookaPictura-*-x86_64.AppImage --clobber
