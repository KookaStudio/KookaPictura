name: appimage

# Builds the x86_64 AppImage for a release tag and attaches it to that release.
# release-please.yml calls this after it cuts a release (a release created with
# GITHUB_TOKEN cannot trigger a `release:` workflow). Run it by hand to rebuild
# or re-upload the asset for an existing tag. The release-please Release PR runs
# the same build as a dry run and keeps the AppImage as a workflow artifact.
# Feature PRs never run it.
on:
  pull_request:
    paths: ['**']
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.1.0 (a leading v is added if omitted)
        type: string
        required: true

concurrency:
  group: appimage-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Release uploads live in their own job; a pull-request dry run is read-only.
permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: >-
      github.event_name != 'pull_request' ||
      github.head_ref == 'ci/703-release-build-hardening' ||
      (github.head_ref == 'release-please--branches--master' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.tag || format('0.0.0~pr{0}', github.event.number) }}
      # sccache, the same setup ci.yml uses.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag != '' && (startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag)) || github.sha }}

      - uses: ./.github/actions/linux-bundle

      - name: Pack the AppImage
        env:
          NO_STRIP: "1"
        run: |
          OUTPUT="KookaPictura-${VERSION#v}-x86_64.AppImage" \
            ./linuxdeploy-x86_64.AppImage --appdir AppDir --output appimage

      # The runner has install-qt-action's Qt on the loader path, which can hide
      # a library linuxdeploy failed to bundle. Run from a clean container with
      # only the artifact mounted.
      - name: Smoke-check the packaged binary in a clean container
        run: |
          appimage=$(ls KookaPictura-*-x86_64.AppImage)
          # GL/EGL drivers and fontconfig/freetype are host libraries that
          # linuxdeploy deliberately does not bundle; every desktop has them.
          # Nothing else comes from the host.
          docker run --rm -e APPIMAGE_EXTRACT_AND_RUN=1 \
            -v "$PWD:/w:ro" ubuntu:24.04 bash -ec "
              apt-get update -qq
              apt-get install -y -qq libgl1 libegl1 libfontconfig1 libfreetype6
              \"/w/$appimage\" --headless --self-test"

      - name: Keep the AppImage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: appimage
          path: KookaPictura-*-x86_64.AppImage
          retention-days: 7
          if-no-files-found: error

  upload:
    runs-on: ubuntu-24.04
    needs: appimage
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag != '' && (startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag)) || '' }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: appimage

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" KookaPictura-*-x86_64.AppImage --clobber
