name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          # Falls back to the default token. Set a RELEASE_PLEASE_TOKEN PAT so CI
          # runs on the Release PR (see DEVELOPING). The packaging jobs below work
          # with either token because they are called, not triggered by the release.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  appimage:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/appimage.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  linux-packages:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/linux-packages.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  snap:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/snap.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  flatpak:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/flatpak.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  windows:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/windows.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  macos:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/macos.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
