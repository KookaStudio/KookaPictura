name: macos

# Builds the Apple Silicon DMG for a release tag and attaches it to that
# release. Same shape as appimage.yml: release-please.yml calls it after it cuts
# a release (a release created with GITHUB_TOKEN cannot trigger a `release:`
# workflow). Run it by hand to rebuild or re-upload the asset for an existing
# tag. The release-please Release PR runs the same build as a dry run and keeps
# the DMG as a workflow artifact. Feature PRs never run it.
#
# The bundle and DMG are unsigned: there is no Apple Developer account yet, so
# the workflow takes no signing secrets and passes no signing options. The
# bundle is ad-hoc signed because Apple Silicon requires a signature; that is
# not notarization. Signing/notarization is #704.
on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - CMakeLists.txt
      - CHANGELOG.md
      - version.txt
      - .release-please-manifest.json
      - .github/workflows/macos.yml
      - .github/actions/macos-bundle/action.yml
      - packaging/**
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.1.0 (a leading v is added if omitted)
        type: string
        required: true

concurrency:
  group: macos-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Release uploads live in their own job; a pull-request dry run is read-only.
permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    if: >-
      github.event_name != 'pull_request' ||
      (github.head_ref == 'release-please--branches--master' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.tag || format('0.0.0~pr{0}', github.event.number) }}
      # sccache, the same setup ci.yml uses.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tag != '' && (startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag)) || github.sha }}

      - uses: ./.github/actions/macos-bundle

      # The deployed bundle must find its own plugins, not the runner's Qt
      # install, so drop the environment the Qt action may have exported.
      - name: Smoke-check the deployed bundle
        run: |
          env -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH \
            -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \
            ./build/pictura.app/Contents/MacOS/pictura --headless --self-test

      # create-dmg is pinned by tag and hash; --skip-jenkins skips the Finder
      # AppleScript that needs an interactive session (and makes
      # --app-drop-link a no-op, so it is not passed).
      - name: Pack the DMG
        run: |
          curl -fsSL -o create-dmg \
            https://raw.githubusercontent.com/create-dmg/create-dmg/v1.3.0/create-dmg
          echo "bb9ea3194e55f2f76a821e87541513748d0fedc69f45cf4f0951cad15ae0cae5  create-dmg" | shasum -a 256 -c -
          chmod +x create-dmg
          mkdir -p dist
          cp -R build/pictura.app dist/
          ./create-dmg \
            --volname "Kooka Pictura ${VERSION#v}" \
            --volicon assets/icons/app.icns \
            --skip-jenkins \
            "KookaPictura-${VERSION#v}-macOS.dmg" \
            dist/

      # Test the artifact users get, from the mounted image, with no runner
      # DYLD/Qt paths in the environment.
      - name: Smoke-check the mounted DMG
        run: |
          set -euo pipefail
          dmg=$(ls KookaPictura-*-macOS.dmg)
          mountpoint=/Volumes/kooka-pictura-test
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mountpoint"
          trap 'hdiutil detach "$mountpoint" || true' EXIT
          app="$mountpoint/Kooka Pictura.app"
          test -f "$app/Contents/Resources/qt.conf"
          env -u QT_PLUGIN_PATH -u QML2_IMPORT_PATH \
            -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH \
            "$app/Contents/MacOS/pictura" --headless --self-test 2>&1 |
            tee dmg-selftest.log
          grep -q 'SUMMARY passed=[0-9]* failed=0' dmg-selftest.log
          if otool -L "$app/Contents/MacOS/pictura" | grep -F "$QT_ROOT_DIR"; then
            echo "::error::the DMG binary references the runner's Qt"
            exit 1
          fi

      - name: Keep the dry-run DMG
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos
          path: KookaPictura-*-macOS.dmg
          retention-days: 7
          if-no-files-found: error

  upload:
    runs-on: ubuntu-24.04
    needs: macos
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag != '' && (startsWith(inputs.tag, 'v') && inputs.tag || format('v{0}', inputs.tag)) || '' }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: macos

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" KookaPictura-*-macOS.dmg --clobber
