name: kooka-pictura
base: core24
grade: stable
confinement: strict
adopt-info: pictura
summary: Raster image editor modeled on Photoshop CS6
license: GPL-3.0-or-later
contact: https://github.com/KookaStudio/KookaPictura/issues
website: https://github.com/KookaStudio/KookaPictura
source-code: https://github.com/KookaStudio/KookaPictura
issues: https://github.com/KookaStudio/KookaPictura/issues
description: |
  Kooka Pictura is a documentation-first reimplementation of Adobe Photoshop
  CS6 in Rust and Qt6. It opens and edits raster images with a layer-based
  workflow.
icon: assets/icons/app.png

apps:
  pictura:
    command: usr/bin/pictura
    desktop: usr/share/applications/pictura.desktop
    extensions:
      - kde-neon-6
    plugs:
      - home
      - removable-media
      - cups

parts:
  pictura:
    plugin: cmake
    source: .
    source-type: local
    # build-environment is applied to the plugin's own build handler; exports
    # made in override-build's scriptlet do not reach it (craftctl default runs
    # in the tooling process). cargo is installed to $HOME/.cargo/bin below.
    build-environment:
      - PATH: $HOME/.cargo/bin:${PATH:+:$PATH}
    build-packages:
      - cmake
      - ninja-build
      - git
      - curl
      - ca-certificates
      - pkg-config
      - lld
      - liblcms2-dev
      - libvulkan-dev
      - libxkbcommon-dev
    stage-packages:
      - liblcms2-2
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld
    override-pull: |
      craftctl default
      # version.txt is the version of record; the workflow writes the dry-run
      # version there before the build. #700: state under ~/.local/state is not
      # writable under strict confinement (the `home` interface excludes hidden
      # paths); persistence across restarts is tracked separately.
      craftctl set version="$(sed 's/^v//' "$CRAFT_PROJECT_DIR/version.txt")"
    override-build: |
      # Rust is not part of the KDE SDK, so install the pinned toolchain (named
      # by rust-toolchain.toml at the project root) before the CMake build drives
      # cargo through Corrosion.
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --profile minimal --default-toolchain none
      . "$HOME/.cargo/env"
      channel="$(sed -n 's/^channel *= *"\([^"]*\)"/\1/p' "$CRAFT_PROJECT_DIR/rust-toolchain.toml")"
      rustup toolchain install "$channel" --profile minimal
      rustup default "$channel"
      # CXX-Qt's qt-build-utils probes qmake with a cleared environment, which
      # strips the SDK's LD_LIBRARY_PATH. Make the SDK's Qt libraries resolvable
      # through the loader cache so the probe works without the environment.
      printf '%s\n%s\n' \
        /snap/kde-qt6-core24-sdk/current/usr/lib/x86_64-linux-gnu \
        /snap/kde-qt6-core24-sdk/current/usr/lib \
        > /etc/ld.so.conf.d/kde-qt6-core24-sdk.conf
      ldconfig
      craftctl default
