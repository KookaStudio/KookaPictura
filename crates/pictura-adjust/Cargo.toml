[package]
name = "pictura-adjust"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
pictura-core = { path = "../pictura-core" }
# Color Balance's Lab mapping shares the D50 sRGB↔Lab model with the picker and
# the Info panel; no new external crate, the binary already links lcms2.
pictura-color = { path = "../pictura-color" }
thiserror.workspace = true
# Chunked per-pixel kernels. Already a workspace dependency used by
# pictura-filters, pictura-render and pictura-codec.
rayon = "1"

[dev-dependencies]
pictura-testkit = { path = "../pictura-testkit" }
