[package]
name = "pictura-codec"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pictura-color = { path = "../pictura-color" }
pictura-core = { path = "../pictura-core" }
thiserror.workspace = true
flate2 = "1"
# WebP decode (VP8/VP8L/VP8X) and lossless encode, so WebP does not depend on
# Qt's optional `qt6-imageformats` plugin. This is the pure-Rust crate the
# `image` meta-crate delegates to for WebP.
image-webp = "0.2"
# The Photoshop PDF standard security handler (RC4-40 … AES-256): MD5, AES,
# and SHA-256/384/512 primitives from RustCrypto rather than hand-rolled
# cryptography; RC4 and CBC chaining are written over them in `pdf/crypt.rs`.
md-5 = "0.10"
aes = "0.8"
sha2 = "0.10"

[dev-dependencies]
pictura-render = { path = "../pictura-render" }
pictura-testkit = { path = "../pictura-testkit" }
