[package]
name = "pictura-codec"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[dependencies]
pictura-color = { path = "../pictura-color" }
pictura-core = { path = "../pictura-core" }
thiserror.workspace = true
flate2 = "1"
quick-xml = "0.42"
# Parallel layer-channel encoding in the PSD writer. Already a workspace
# dependency used by pictura-render and pictura-app; the codec joins it rather
# than adding a worker pool of its own.
rayon = "1"
# WebP decode (VP8/VP8L/VP8X) and lossless encode, so WebP does not depend on
# Qt's optional `qt6-imageformats` plugin. This is the pure-Rust crate the
# `image` meta-crate delegates to for WebP.
image-webp = "0.2"
# Lossy VP8 encode with alpha (#807). Pure Rust, `#![forbid(unsafe_code)]`,
# MIT OR Apache-2.0, so it avoids a bundled `libwebp` C build and keeps WebP
# independent of Qt's optional plugin. `gamut-core` supplies its image types.
gamut-webp = "0.3"
gamut-core = "2"
# JPEG 2000 codestream encoding for the PDF writer. 0.11 is a pure-Rust port of
# OpenJPEG (no native library), so `/JPXDecode` does not depend on a Qt or KDE
# image plugin.
jpeg2k = "0.11"
# The Photoshop PDF standard security handler (RC4-40 … AES-256): MD5, AES,
# and SHA-256/384/512 primitives from RustCrypto rather than hand-rolled
# cryptography; RC4 and CBC chaining are written over them in `pdf/crypt.rs`.
md-5 = "0.10"
aes = "0.8"
sha2 = "0.10"
# The operating system's random source for PDF salts, file IDs, and scratch
# names (#844 M7); already in Cargo.lock as a transitive dependency.
getrandom = "0.4"

# setrlimit for the Ghostscript child (#844 H7); already in Cargo.lock.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# The R7 packing benchmark (#1217); pictura-core already depends on it.
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
pictura-render = { path = "../pictura-render" }
pictura-testkit = { path = "../pictura-testkit" }
