[package]
name = "pictura-color"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
thiserror.workspace = true
lcms2 = "6"

# macOS release bundles must not depend on a Homebrew dylib: link lcms2-sys's
# vendored static copy instead, the same way Windows does through its fallback.
[target.'cfg(target_os = "macos")'.dependencies]
lcms2 = { version = "6", features = ["static"] }

[dev-dependencies]
pictura-testkit = { path = "../pictura-testkit" }
