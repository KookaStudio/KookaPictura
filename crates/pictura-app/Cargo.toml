[package]
name = "pictura_app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Cargo builds the Rust bridge as a static library; CMake links it into the
# C++ executable. `rlib` keeps the crate usable from Rust tests.
[lib]
doctest = false
crate-type = ["staticlib", "rlib"]

[dependencies]
pictura-core = { path = "../pictura-core" }
pictura-codec = { path = "../pictura-codec" }
pictura-color = { path = "../pictura-color" }
pictura-ops = { path = "../pictura-ops" }
pictura-render = { path = "../pictura-render" }
pictura-select = { path = "../pictura-select" }
pictura-script = { path = "../pictura-script" }
pictura-mcp = { path = "../pictura-mcp" }
pictura-filters = { path = "../pictura-filters" }
pictura-paint = { path = "../pictura-paint" }
# cxx is the FFI layer the `#[cxx_qt::bridge]` macro expands to.
cxx = "1.0"
cxx-qt = "0.10"
# qt_gui is only needed for QImage; Core (QString) is always available.
cxx-qt-lib = { version = "0.10", features = ["qt_gui"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
pollster = "1"
# Whole-plane history diffs and copies run on every core; already in the
# workspace through pictura-render and pictura-filters.
rayon = "1"

# ash is the Vulkan bindings the zero-copy interop probe uses to export raw
# VkDevice/VkImage handles. wgpu has no Vulkan backend on Apple targets, so it
# is only needed where that probe compiles (see `src/gpu.rs`).
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
ash = "0.38"

[build-dependencies]
cxx-qt-build = "0.10"

# Windows compiles the Direct3D 12 backend alongside Vulkan; Linux keeps the
# Vulkan-only graph. The feature is target-scoped so Windows-only transitive
# crates never enter the Linux build.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "dx12", "vulkan", "wgsl"] }
