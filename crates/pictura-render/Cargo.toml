[package]
name = "pictura-render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
doctest = false

[features]
# Test-only: let the GPU probe accept a software (CPU-type) device so the GPU
# parity tests run on lavapipe (Linux) or WARP (Windows) in CI. Never enable it
# in a manifest.
software-gpu = []

[dependencies]
unicode-bidi = "0.3"
# The built-in pattern set a Pattern Overlay offers; also the CPU stroke
# engine the GPU stroke parity test checks against.
pictura-paint = { path = "../pictura-paint" }
pictura-core = { path = "../pictura-core" }
# M4-B: decode adjustment-layer payloads into destructive Adjustment ops.
pictura-adjust = { path = "../pictura-adjust" }
# M12: document-wide resize/canvas/orientation wrappers.
pictura-ops = { path = "../pictura-ops" }
# M6-C: apply destructive filters to a layer's color channels.
pictura-filters = { path = "../pictura-filters" }
# Decode an embedded PSD/PSB smart-object source when a layer has no raster proxy.
pictura-codec = { path = "../pictura-codec" }
# Mask feather reuses the selection feather's blur.
pictura-select = { path = "../pictura-select" }
# wgpu/pollster versions track `pictura-app`, which already pulls wgpu 30.0.1.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "vulkan", "wgsl"] }
pollster = "1"
# Pure-Rust HarfBuzz port for line shaping (kerning + default GPOS/GSUB).
rustybuzz = "0.20"
# Pure-Rust glyph rasterizer honoring fractional subpixel offsets.
swash = { version = "0.2.10", features = ["scale", "render"] }
# Row-parallel CPU composite fallback (canvas-view-performance D10).
rayon = "1"

[dev-dependencies]
pictura-testkit = { path = "../pictura-testkit" }
# Inflate the PDF content stream the live-text tests read; already in the tree
# through pictura-codec.
flate2 = "1"

# Windows compiles the Direct3D 12 backend alongside Vulkan; Linux keeps the
# Vulkan-only graph. The feature is target-scoped so Windows-only transitive
# crates never enter the Linux build.
[target.'cfg(windows)'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "dx12", "vulkan", "wgsl"] }
