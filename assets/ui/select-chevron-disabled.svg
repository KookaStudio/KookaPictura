<!-- The disabled select drop-down chevron: a mid grey that reads as dimmed on
     both families' disabled input surfaces. The Qt stylesheet engine cannot
     tint an SVG (`currentColor` renders black), so the disabled chevron ships as
     its own baked file. Original project artwork, CC0-1.0 / MIT. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
     fill="none" stroke="#808080" stroke-width="2" stroke-linecap="round"
     stroke-linejoin="round">
  <path d="m6 9 6 6 6-6" />
</svg>
