<!-- The check mark drawn inside a checked checkbox. The checked box is the
     highlight fill with white highlighted text, so the tick is white and
     correct in both theme families and every brightness level. Original project
     artwork, CC0-1.0 / MIT. -->
<svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24"
     fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"
     stroke-linejoin="round">
  <path d="M20 6 9 17l-5-5" />
</svg>
