# CXX-Qt on Linux expects a fast linker (mold/lld/ld.gold); lld is the portable
# choice. Applies to cargo test/clippy and to Corrosion's cargo call from CMake.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# One QMAKE value for every cargo invocation. The cxx-qt build script tracks
# QMAKE (rerun-if-env-changed), so a value that changes between two cargo
# invocations rebuilds cxx-qt-lib, cxx-qt and pictura_app for nothing. The
# local verification scripts export none, so this table is the value a cargo
# invocation sees unless its environment carries one: the CMake build exports
# the path it selected, which wins over this default. The bare name is
# searched on PATH by the cxx-qt build script; both supported distributions
# ship qmake6.
[env]
QMAKE = { value = "qmake6" }
